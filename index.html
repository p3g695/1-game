<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inverse 2048 - Reach 1!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #faf8ef;
      color: #776e65;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 48px;
      font-weight: bold;
      color: #776e65;
    }

    .score-container {
      background: #bbada0;
      padding: 10px 25px;
      border-radius: 6px;
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .score-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #eee4da;
    }

    .score-value {
      font-size: 24px;
    }

    .instructions {
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.4;
    }

    .game-board {
      width: 400px;
      height: 400px;
      background-color: #bbada0;
      border-radius: 6px;
      padding: 15px;
      position: relative;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 15px;
      width: 100%;
      height: 100%;
    }

    .grid-cell {
      background-color: rgba(238, 228, 218, 0.35);
      border-radius: 3px;
    }

    .tile-container {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      pointer-events: none;
    }

    .tile {
      position: absolute;
      width: 78.75px;
      height: 78.75px;
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      transition: transform 0.1s ease-in-out;
    }

    /* Tile Placement Positioning */
    .position-0-0 { transform: translate(0px, 0px); }
    .position-0-1 { transform: translate(93.75px, 0px); }
    .position-0-2 { transform: translate(187.5px, 0px); }
    .position-0-3 { transform: translate(281.25px, 0px); }

    .position-1-0 { transform: translate(0px, 93.75px); }
    .position-1-1 { transform: translate(93.75px, 93.75px); }
    .position-1-2 { transform: translate(187.5px, 93.75px); }
    .position-1-3 { transform: translate(281.25px, 93.75px); }

    .position-2-0 { transform: translate(0px, 187.5px); }
    .position-2-1 { transform: translate(93.75px, 187.5px); }
    .position-2-2 { transform: translate(187.5px, 187.5px); }
    .position-2-3 { transform: translate(281.25px, 187.5px); }

    .position-3-0 { transform: translate(0px, 281.25px); }
    .position-3-1 { transform: translate(93.75px, 281.25px); }
    .position-3-2 { transform: translate(187.5px, 281.25px); }
    .position-3-3 { transform: translate(281.25px, 281.25px); }

    /* Tile Animations */
    .tile-new {
      animation: appear 0.2s ease-in-out;
    }

    .tile-merged {
      animation: pop 0.2s ease-in-out 0.1s;
    }

    @keyframes appear {
      0% {
        opacity: 0;
        scale: 0;
      }
      100% {
        opacity: 1;
        scale: 1;
      }
    }

    @keyframes pop {
      0% {
        scale: 1;
      }
      50% {
        scale: 1.2;
      }
      100% {
        scale: 1;
      }
    }

    /* Tile Colors */
    .tile-2048 { background: #eee4da; color: #776e65; }
    .tile-1024 { background: #ede0c8; color: #776e65; }
    .tile-512  { background: #f2b179; color: #f9f6f2; }
    .tile-256  { background: #f59563; color: #f9f6f2; }
    .tile-128  { background: #f67c5f; color: #f9f6f2; }
    .tile-64   { background: #f65e3b; color: #f9f6f2; }
    .tile-32   { background: #edcf72; color: #f9f6f2; }
    .tile-16   { background: #edcc61; color: #f9f6f2; }
    .tile-8    { background: #edc850; color: #f9f6f2; }
    .tile-4    { background: #edc53f; color: #f9f6f2; }
    .tile-2    { background: #edc22e; color: #f9f6f2; }
    .tile-1    { background: #3c3a32; color: #f9f6f2; box-shadow: 0 0 10px #edc22e; }

    /* Game Over Overlay Animation */
    .game-over {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(238, 228, 218, 0.73);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 36px;
      font-weight: bold;
      color: #776e65;
      z-index: 100;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    .restart-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #8f7a66;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
    }

    .restart-btn:hover {
      background: #9f8a76;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>1</h1>
      <div class="score-container">
        <div class="score-title">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
    </div>
    
    <div class="instructions">
      Join the numbers to divide down and reach the <strong>1 tile!</strong>
    </div>

    <div class="game-board">
      <div class="grid-container">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div class="tile-container" id="tile-container"></div>
      <div id="overlay-container"></div>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 4;
    let board = [];
    let score = 0;
    let tileIdCounter = 0;
    let isMoving = false;

    function initGame() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
      score = 0;
      tileIdCounter = 0;
      updateScore(0);
      document.getElementById('overlay-container').innerHTML = '';
      document.getElementById('tile-container').innerHTML = '';
      
      spawnTile();
      spawnTile();
      renderBoard();
    }

    function spawnTile() {
      const emptyCells = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (!board[r][c]) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length > 0) {
        const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        const val = Math.random() < 0.9 ? 2048 : 1024;
        board[r][c] = {
          id: ++tileIdCounter,
          val: val,
          r: r,
          c: c,
          isNew: true,
          merged: false
        };
      }
    }

    function renderBoard() {
      const container = document.getElementById('tile-container');
      container.innerHTML = '';

      let hasWon = false;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const tile = board[r][c];
          if (tile) {
            const tileElement = document.createElement('div');
            tileElement.className = `tile tile-${tile.val} position-${tile.r}-${tile.c}`;
            tileElement.textContent = tile.val;

            if (tile.isNew) {
              tileElement.classList.add('tile-new');
              tile.isNew = false;
            } else if (tile.merged) {
              tileElement.classList.add('tile-merged');
              tile.merged = false;
            }

            container.appendChild(tileElement);

            if (tile.val === 1) hasWon = true;
          }
        }
      }

      if (hasWon) {
        showOverlay("You Win!");
      } else if (isGameOver()) {
        showOverlay("Game Over!");
      }
    }

    function updateScore(amount) {
      score += amount;
      document.getElementById('score').textContent = score;
    }

    function slideLine(line) {
      let result = [];
      let mergedInLine = false;

      // Filter out empty spaces
      let filtered = line.filter(tile => tile !== null);

      for (let i = 0; i < filtered.length; i++) {
        if (i < filtered.length - 1 && filtered[i].val === filtered[i + 1].val) {
          // Merge tiles (Halve value)
          let mergedVal = filtered[i].val / 2;
          let mergedTile = {
            id: filtered[i].id,
            val: mergedVal,
            r: filtered[i].r,
            c: filtered[i].c,
            isNew: false,
            merged: true
          };
          result.push(mergedTile);
          updateScore(2048 / mergedVal);
          i++; // Skip merged partner
          mergedInLine = true;
        } else {
          filtered[i].merged = false;
          filtered[i].isNew = false;
          result.push(filtered[i]);
        }
      }

      while (result.length < BOARD_SIZE) {
        result.push(null);
      }

      return { line: result, moved: mergedInLine };
    }

    function move(direction) {
      if (isMoving) return;
      isMoving = true;

      let hasMoved = false;

      if (direction === 'LEFT' || direction === 'RIGHT') {
        for (let r = 0; r < BOARD_SIZE; r++) {
          let row = board[r];
          if (direction === 'RIGHT') row.reverse();
          
          let { line: newRow, moved } = slideLine(row);
          if (direction === 'RIGHT') newRow.reverse();

          for (let c = 0; c < BOARD_SIZE; c++) {
            if (newRow[c]) {
              if (board[r][c] !== newRow[c] || newRow[c].r !== r || newRow[c].c !== c) {
                hasMoved = true;
              }
              newRow[c].r = r;
              newRow[c].c = c;
            } else if (board[r][c] !== null) {
              hasMoved = true;
            }
          }
          board[r] = newRow;
        }
      } else if (direction === 'UP' || direction === 'DOWN') {
        for (let c = 0; c < BOARD_SIZE; c++) {
          let column = [board[0][c], board[1][c], board[2][c], board[3][c]];
          if (direction === 'DOWN') column.reverse();
          
          let { line: newColumn, moved } = slideLine(column);
          if (direction === 'DOWN') newColumn.reverse();

          for (let r = 0; r < BOARD_SIZE; r++) {
            if (newColumn[r]) {
              if (board[r][c] !== newColumn[r] || newColumn[r].r !== r || newColumn[r].c !== c) {
                hasMoved = true;
              }
              newColumn[r].r = r;
              newColumn[r].c = c;
            } else if (board[r][c] !== null) {
              hasMoved = true;
            }
            board[r][c] = newColumn[r];
          }
        }
      }

      if (hasMoved) {
        renderBoard(); // Animate slide transition
        setTimeout(() => {
          spawnTile();
          renderBoard(); // Animate new tile spawn / pop
          isMoving = false;
        }, 100);
      } else {
        isMoving = false;
      }
    }

    function isGameOver() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (!board[r][c]) return false;
          if (c < BOARD_SIZE - 1 && board[r][c + 1] && board[r][c].val === board[r][c + 1].val) return false;
          if (r < BOARD_SIZE - 1 && board[r + 1][c] && board[r][c].val === board[r + 1][c].val) return false;
        }
      }
      return true;
    }

    function showOverlay(message) {
      const container = document.getElementById('overlay-container');
      if (container.children.length > 0) return;

      const overlay = document.createElement('div');
      overlay.className = 'game-over';
      overlay.innerHTML = `
        ${message}
        <button class="restart-btn" onclick="initGame()">Try Again</button>
      `;
      container.appendChild(overlay);
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': move('UP'); break;
        case 'ArrowDown': move('DOWN'); break;
        case 'ArrowLeft': move('LEFT'); break;
        case 'ArrowRight': move('RIGHT'); break;
      }
    });

    initGame();
  </script>
</body>
</html>
