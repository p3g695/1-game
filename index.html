<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inverse 2048 - Reach 1!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #faf8ef;
      color: #776e65;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 48px;
      font-weight: bold;
      color: #776e65;
    }

    .score-container {
      background: #bbada0;
      padding: 10px 25px;
      border-radius: 6px;
      color: white;
      text-align: center;
      font-weight: bold;
    }

    .score-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #eee4da;
    }

    .score-value {
      font-size: 24px;
    }

    .instructions {
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.4;
    }

    .game-board {
      width: 400px;
      height: 400px;
      background-color: #bbada0;
      border-radius: 6px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 15px;
      position: relative;
    }

    .cell {
      background-color: rgba(238, 228, 218, 0.35);
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      transition: all 0.15s ease-in-out;
    }

    /* Tile Colors matching original 2048 palette mapped to inverse values */
    .tile-2048 { background: #eee4da; color: #776e65; }
    .tile-1024 { background: #ede0c8; color: #776e65; }
    .tile-512  { background: #f2b179; color: #f9f6f2; }
    .tile-256  { background: #f59563; color: #f9f6f2; }
    .tile-128  { background: #f67c5f; color: #f9f6f2; }
    .tile-64   { background: #f65e3b; color: #f9f6f2; }
    .tile-32   { background: #edcf72; color: #f9f6f2; }
    .tile-16   { background: #edcc61; color: #f9f6f2; }
    .tile-8    { background: #edc850; color: #f9f6f2; }
    .tile-4    { background: #edc53f; color: #f9f6f2; }
    .tile-2    { background: #edc22e; color: #f9f6f2; }
    .tile-1    { background: #3c3a32; color: #f9f6f2; box-shadow: 0 0 10px #edc22e; }

    .game-over {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(238, 228, 218, 0.73);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 36px;
      font-weight: bold;
      color: #776e65;
    }

    .restart-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #8f7a66;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .restart-btn:hover {
      background: #9f8a76;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>1</h1>
      <div class="score-container">
        <div class="score-title">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
    </div>
    
    <div class="instructions">
      Join the numbers to divide down and get to the <strong>1 tile!</strong>
    </div>

    <div class="game-board" id="board"></div>
  </div>

  <script>
    const BOARD_SIZE = 4;
    let board = [];
    let score = 0;

    function initGame() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
      score = 0;
      updateScore(0);
      spawnTile();
      spawnTile();
      renderBoard();
    }

    function spawnTile() {
      const emptyCells = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === 0) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length > 0) {
        const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        // Spawns 2048 (90% chance) or 1024 (10% chance)
        board[r][c] = Math.random() < 0.9 ? 2048 : 1024;
      }
    }

    function renderBoard() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';

      let hasWon = false;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (val > 0) {
            cell.textContent = val;
            cell.classList.add(`tile-${val}`);
          }
          if (val === 1) hasWon = true;
          boardElement.appendChild(cell);
        }
      }

      if (hasWon) {
        showOverlay("You Win!");
      } else if (isGameOver()) {
        showOverlay("Game Over!");
      }
    }

    function updateScore(amount) {
      score += amount;
      document.getElementById('score').textContent = score;
    }

    function slide(row) {
      let arr = row.filter(val => val !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] = arr[i] / 2; // Divide down instead of multiplying
          updateScore(2048 / arr[i]);
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(val => val !== 0);
      while (arr.length < BOARD_SIZE) {
        arr.push(0);
      }
      return arr;
    }

    function move(direction) {
      let moved = false;
      let prevBoard = JSON.stringify(board);

      if (direction === 'LEFT' || direction === 'RIGHT') {
        for (let r = 0; r < BOARD_SIZE; r++) {
          let row = board[r];
          if (direction === 'RIGHT') row.reverse();
          let newRow = slide(row);
          if (direction === 'RIGHT') newRow.reverse();
          board[r] = newRow;
        }
      } else if (direction === 'UP' || direction === 'DOWN') {
        for (let c = 0; c < BOARD_SIZE; c++) {
          let column = [board[0][c], board[1][c], board[2][c], board[3][c]];
          if (direction === 'DOWN') column.reverse();
          let newColumn = slide(column);
          if (direction === 'DOWN') newColumn.reverse();
          for (let r = 0; r < BOARD_SIZE; r++) {
            board[r][c] = newColumn[r];
          }
        }
      }

      if (JSON.stringify(board) !== prevBoard) {
        spawnTile();
        renderBoard();
      }
    }

    function isGameOver() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === 0) return false;
          if (c < BOARD_SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
          if (r < BOARD_SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
        }
      }
      return true;
    }

    function showOverlay(message) {
      const boardElement = document.getElementById('board');
      const overlay = document.createElement('div');
      overlay.className = 'game-over';
      overlay.innerHTML = `
        ${message}
        <button class="restart-btn" onclick="initGame()">Try Again</button>
      `;
      boardElement.appendChild(overlay);
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': move('UP'); break;
        case 'ArrowDown': move('DOWN'); break;
        case 'ArrowLeft': move('LEFT'); break;
        case 'ArrowRight': move('RIGHT'); break;
      }
    });

    initGame();
  </script>
</body>
</html>
